<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BMJ Incidents — POC</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    
    <header class="top-bar">
        <div class="logo-wrapper">
          <img src="./imgs/BADLOGO.png" alt="BMJ Logo" class="logo-img" />
           
        </div>
        <h1 class="app-title">BMJ Incidents</h1>
    </header>
    <div id="app">
        <h2>BMJ Incidents</h2>

        <section id="auth">
            <div id="login-area">
                <h3>Login</h3>
                <label>Email: <input id="email" type="email" /></label>
                <label>Password: <input id="password" type="password" /></label>
                <button id="btn-login">Login</button>
                <button id="btn-register">Register</button>
            </div>

            <div id="user-area" class="hidden">
                <div>Signed in as <strong id="user-name"></strong> 
                    <span id="user-role" class="role-badge"></span>
                </div>
                <button id="btn-logout">Logout</button>
            </div>
        </section>

        <section id="create-ticket" class="hidden">
            <h3>Create Ticket</h3>
            <label>Title: <input id="title" type="text" /></label>
            <label>Description: <textarea id="description"></textarea></label>
            <label>Category: <input id="category" type="text" value="General" /></label>
            <label>Priority:
            <select id="priority">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>
            </select>
            </label>
            <button id="btn-create">Create Ticket</button>
        </section>

        <section id="tickets" class="hidden">
            <h3>Tickets</h3>
            <button id="btn-refresh">Refresh</button>
            <div id="tickets-list"></div>
        </section>

        <div id="message" class="message"></div>
    </div>

<script src="app.js"></script>
</body>
</html>
